apiVersion: 1

# This is dashboard providers declaration
providers:
# Create provider name my-dashboard
- name: 'my-dashboard'
  orgId: 1
  # Create from dashboard json file
  type: 'file'
  # You can not delete dashboard
  disableDeletion: true
  # You can not edit dashboard
  editable: true
  options:
    # Read dashboard json file from the following path
    path: '/etc/grafana/provisioning/dashboards/json/'
    # It will retain and create subfolder in Grafana
    foldersFromFilesStructure: true

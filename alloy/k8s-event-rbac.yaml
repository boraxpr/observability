# For loki.source.kubernetes_events
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-event-watcher
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-event-watcher
rules:
  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-event-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-event-watcher
subjects:
  - kind: ServiceAccount
    name: alloy-event-watcher
    namespace: monitoring

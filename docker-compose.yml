networks:
  monitoring:
    driver: bridge

services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.6.0
    user: "1000:1000"
    volumes:
      - ./prometheus/data:/prometheus
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/config/rules:/etc/prometheus/rules/
    ports:
      - 9090:9090
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    - --web.enable-lifecycle
    - --web.external-url=https://9090-${WEB_HOST}
    networks:
      - monitoring

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.9.1
    volumes:
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
      - '/:/rootfs:ro'
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring

  app-demo-1:
    container_name: app-demo-1
    image: julius/prometheus-demo-service:0.12.0
    ports:
      - "10001:8080"
    networks:
      - monitoring

  app-demo-2:
    container_name: app-demo-2
    image: julius/prometheus-demo-service:0.12.0
    ports:
      - "10002:8080"
    networks:
      - monitoring

  app-demo-3:
    container_name: app-demo-3
    image: julius/prometheus-demo-service:0.12.0
    ports:
      - "10003:8080"
    networks:
      - monitoring

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:v0.28.1
    user: "1000:1000"
    ports:
      - 9093:9093
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://9093-${WEB_HOST}
      - --log.level=debug
    volumes:
      - ./alertmanager/data:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - monitoring

  blackbox-exporter:
    container_name: blackbox-exporter
    image: prom/blackbox-exporter:v0.27.0
    networks:
      - monitoring

  grafana:
    container_name: grafana
    image: grafana/grafana:12.3.0-18081912450-ubuntu
    user: "1000:1000"
    # ports:
    #   - 3000:3000
    environment:
      GF_SERVER_DOMAIN: 9000-${WEB_HOST}
    volumes:
      - ./grafana/data/:/var/lib/grafana
      - ./grafana/config/:/etc/grafana/
    networks:
      - monitoring

  nginx:
    container_name: nginx
    image: nginx:1.29.1-alpine-slim
    ports:
      - 9000:80
    environment:
      SERVER_DOMAIN: 9000-${WEB_HOST}
    volumes:
      - ./nginx/templates:/etc/nginx/templates
    depends_on:
      - grafana
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: nginx-exporter
    ports:
      - 9113:9113
    command:
      - '-nginx.scrape-uri=http://nginx/stub_status'
    depends_on:
      - nginx
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    privileged: true
    ports:
      - 8888:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

  mysql:
    image: mysql:9.4.0-oraclelinux9
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    networks:
      - monitoring

  mysql-exporter:
    image: prom/mysqld-exporter:v0.18.0
    container_name: mysql-exporter
    command:
      - "--mysqld.username=root"
      - "--mysqld.address=mysql:3306"
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: rootpass
    depends_on:
      - mysql
    networks:
      - monitoring

  mariadb-slap:
    image: mariadb:12.0.2-noble
    container_name: mariadb-slap
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    command:
      - /bin/bash
      - -c
      - |
        mariadb-slap -h mysql --skip-ssl -p$${MYSQL_ROOT_PASSWORD} --auto-generate-sql -vv --iterations=10
    depends_on:
      - mysql
    restart: always
    networks:
      - monitoring

  go-sample:
    container_name: go-sample
    hostname: go-sample
    build:
      context: ./go-instrumentation
      args:
        APP_NAME: sample
        APP_PORT: 8081
    environment:
      APP_PORT: 8081
    ports:
      - 8081:8081
    networks:
      - monitoring

  go-practice:
    container_name: go-practice
    hostname: go-practice
    build:
      context: ./go-instrumentation
      args:
        APP_NAME: practice
        APP_PORT: 8082
    environment:
      APP_PORT: 8082
    ports:
      - 8082:8082
    networks:
      - monitoring

  curl:
    image: curlimages/curl:8.16.0
    container_name: curl
    entrypoint:
      - "watch"
      - "-n1"
    command: >
      curl -s
        http://go-sample:8081
        http://go-sample:8081/foo
        http://go-sample:8081/bar
        http://go-practice:8082/api/foo
        http://go-practice:8082/api/bar
        http://go-log:8083
        http://go-log:8083/foo
        http://go-log:8083/bar
    depends_on:
      - go-sample
      - go-practice
      - go-log
    networks:
      - monitoring
  loki:
    container_name: loki
    image: grafana/loki:3.5.5
    ports:
      - 3100:3100
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail-1:
    container_name: promtail-1
    hostname: promtail-1
    image: grafana/promtail:3.5.5
    ports:
      - 9081:9080
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring
  promtail-2:
    container_name: promtail-2
    hostname: promtail-2
    image: grafana/promtail:3.5.5
    ports:
      - 9082:9080
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring

  flog-common:
    container_name: flog-common
    image: mingrammer/flog:0.4.3
    command:
      - -d=3s
      - -l
      - -f=apache_common
    networks:
      - monitoring
  flog-combined:
    container_name: flog-combined
    image: mingrammer/flog:0.4.3
    command:
      - -d=3s
      - -l
      - -f=apache_combined
    networks:
      - monitoring
  flog-error:
    container_name: flog-error
    image: mingrammer/flog:0.4.3
    command:
      - -d=15s
      - -l
      - -f=apache_error
    networks:
      - monitoring

  go-log:
    container_name: go-log
    hostname: go-log
    build:
      context: ./go-instrumentation
      args:
        APP_NAME: log
        APP_PORT: 8083
    environment:
      APP_PORT: 8083
    ports:
      - 8083:8083
    networks:
      - monitoring
  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.73.0
    user: "1000:1000"
    ports:
      - "14269:14269"
      - "16686:16686"
    volumes:
      - "./jaeger/jaeger-ui.json:/etc/jaeger/jaeger-ui.json"
      - "./jaeger/data/:/badger/"
    environment:
      QUERY_UI_CONFIG: /etc/jaeger/jaeger-ui.json
      LOG_LEVEL: debug
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
      PROMETHEUS_QUERY_NORMALIZE_CALLS: true
      PROMETHEUS_QUERY_NORMALIZE_DURATION: true
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: false
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    networks:
      - monitoring

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.136.0
    volumes:
      - "./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - monitoring

  hotrod:
    container_name: hotrod
    hostname: hotrod
    image: jaegertracing/example-hotrod:1.73.0
    depends_on:
      - otel-collector
    ports:
      - "8088:8080"
    command:
      - all
      - --fix-disable-db-conn-mutex
      - --fix-route-worker-pool-size=10
      - --fix-db-query-delay=100ms
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - monitoring


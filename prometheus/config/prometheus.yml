# my global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "alertmanager:9093"

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "rules/alerts_rules.yaml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9090"]
        # The label name is added as a label `label_name=<label_value>` to any timeseries scraped from this config.
        labels:
          app: "prometheus"
  - job_name: "node-exporter"
    static_configs:
      - targets:
        - "node-exporter:9100"
        - "git.demo.opsta.co.th:9100"

  - job_name: "app-demo"
    static_configs:
      - targets:
        - "app-demo-1:8080"
        - "app-demo-2:8080"
        - "app-demo-3:8080"

  - job_name: 'blackbox-probe'
    metrics_path: /probe # Don't scrape /metrics, but /probe on the Blackbox Exporter.
    params:
      module:
        - http_2xx # Select the "http_2xx" module configured in the Blackbox Exporter.
    static_configs:
      - targets:
        - "http://git.demo.opsta.co.th"     # Target to probe with HTTP.
        - "https://git.demo.opsta.co.th"    # Target to probe with HTTPS.
        - "http://unreach.opsta.co.th"      # Unreachable target to probe with HTTP.
        - http://app-demo-1:8080/api/foo
        - http://app-demo-1:8080/api/bar
        - http://app-demo-2:8080/api/foo
        - http://app-demo-2:8080/api/bar
        - http://app-demo-3:8080/api/foo
        - http://app-demo-3:8080/api/bar
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115 # Blackbox exporter address.

  - job_name: "nginx-exporter"
    static_configs:
      - targets:
        - "nginx-exporter:9113"

  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "grafana:3000"

  - job_name: "cAdvisor"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "cadvisor:8080"
  
  - job_name: "mysql"
    metrics_path: /metrics
    static_configs:
      - targets:
        - "mysql-exporter:9104"

  - job_name: "app-prom"
    static_configs:
      - targets:
        - "go-sample:8081"
        - "go-practice:8082"
        - "go-log:8083"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*):.*'
        replacement: '${1}'

  - job_name: "jaeger"
    static_configs:
      - targets:
        - "jaeger:14269"

  - job_name: "otel-collector"
    static_configs:
      - targets:
        - "otel-collector:8889"

  - job_name: "hotrod"
    static_configs:
      - targets:
        - "hotrod:8080"

  - job_name: "fastapi"
    static_configs:
      - targets:
        - "fastapi-alloy:8000"
        
  - job_name: "locust-exporter"
    scrape_interval: 1s
    static_configs:
      - targets:
        - "locust-exporter:9191"
  # Pull method 
  # - job_name: "alloy"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets:
  #       - "alloy:12345"
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: prometheus
  - job_name: "kubernetes-kubelet"
    scheme: https
    tls_config:
      insecure_skip_verify: true

    kubernetes_sd_configs:
      - role: node

    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

      - target_label: __address__
        replacement: kubernetes.default.svc:443

      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  - job_name: "kubernetes-services"

    kubernetes_sd_configs:
      - role: endpoints

    relabel_configs:
      - source_labels:
          [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
